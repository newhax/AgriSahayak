<!doctype html>
<html lang="en">
  <head>
    <script>
      // Make window.fetch configurable with a setter to prevent read-only/getter TypeError crashes
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            }
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch:", e);
        }
      })();
    </script>
